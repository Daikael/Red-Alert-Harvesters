[item-description]
cncharvester=An old war truck used to gather resources. Craft cost includes a solar panel and battery (not installed). Install your own grid equipment; Hybrid converts stored electricity into burner energy. SHIFT+E opens the module bay.
cncharvester-type2=An updated harvester used to safely gather tiberium. Craft cost includes a solar panel and battery (not installed). Install your own grid equipment; Hybrid converts stored electricity into burner energy. SHIFT+E opens the module bay.
refinery=A storage facility to deposit ore from the harvester.
Hybrid-drive=Optional grid battery. Hybrid conversion uses any stored grid energy; this item is not required and is not given free on a new truck.
Hybrid-drive-battery=Optional extra grid storage. Not given free on a new truck.
