auto-operation=Automatic operation
auto-operation-tooltip=When enabled, this truck drives itself and ignores WASD. Disable it in this inventory to take the wheel. Pause when somebody jumps in is the only way to sit while auto is on. Only applies while Automatic harvester testing is on.
pause-on-enter=Pause when somebody jumps in
pause-on-enter-tooltip=When enabled, you can sit: auto yields until you exit. When disabled (default), auto keeps driving and ignores player input (eject is optional).
needs-testing-flag=Requires the Automatic harvester testing startup setting.
