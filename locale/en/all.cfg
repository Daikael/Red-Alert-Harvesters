[entity-description]
cncharvester=An old war truck used to gather resources. Craft cost includes a solar panel and battery that provide a slow built-in recharge (not installed as removable equipment). A 2×2 grid accepts portable solar/batteries for faster Hybrid charging. SHIFT+E opens the module bay.
cncharvester-type2=An updated harvester used to safely gather tiberium. Craft cost includes a solar panel and battery that provide a slow built-in recharge (not installed as removable equipment). A 3×3 grid accepts portable solar/batteries for faster Hybrid charging. SHIFT+E opens the module bay.
cncharvester-module-bay=Slave miner for the Ore Truck. Modules here apply natively (productivity bonus, efficiency draw, speed). The energy bar is this drill's draw, paid from the hybrid pool. Press SHIFT+E while driving to open.
cncharvester-type2-module-bay=Slave miner for the Tiberium harvester. Modules here apply natively (productivity bonus, efficiency draw, speed). The energy bar is this drill's draw, paid from the hybrid pool. Press SHIFT+E while driving to open.
[item-name]
cncharvester=Ore Truck
cncharvester-type2=Tiberium harvester
refinery=Refinery
cncharvester-hybrid-charge=Hybrid charge
[item-description]
cncharvester=An old war truck used to gather resources. Craft cost includes a solar panel and battery that provide a slow built-in recharge (not installed as removable equipment). A 2×2 grid accepts portable solar/batteries; Hybrid converts stored electricity into the hybrid-charge reservoir. SHIFT+E opens the module bay.
cncharvester-type2=An updated harvester used to safely gather tiberium. Craft cost includes a solar panel and battery that provide a slow built-in recharge (not installed as removable equipment). A 3×3 grid accepts portable solar/batteries; Hybrid converts stored electricity into the hybrid-charge reservoir. SHIFT+E opens the module bay.
refinery=A storage facility to deposit ore from the harvester.
cncharvester-hybrid-charge=Electrical energy stored in the harvester's hybrid reservoir. Charged from baked-in solar, player-installed portable solar/batteries, or converted solid fuel. Fuel inserted in the tank charges this electrical capacity. Not a removable item.
[fuel-category-name]
cncharvester-hybrid=Hybrid charge
[fuel-category-description]
cncharvester-hybrid=Hybrid-charge reservoir. Burnable fuel and grid electricity charge this electrical capacity. Nuclear fuel is not accepted.
