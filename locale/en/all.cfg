[entity-description]
cncharvester=An old war truck used to gather resources. Craft cost includes a solar panel and battery that provide a slow built-in recharge (not installed as removable equipment). Install your own grid equipment for faster Hybrid charging. SHIFT+E opens the module bay.
cncharvester-type2=An updated harvester used to safely gather tiberium. Craft cost includes a solar panel and battery that provide a slow built-in recharge (not installed as removable equipment). Install your own grid equipment for faster Hybrid charging. SHIFT+E opens the module bay.
cncharvester-module-bay=Companion module bay for the Ore Truck. Insert speed, productivity, efficiency, or quality modules. Press SHIFT+E while driving to open.
cncharvester-type2-module-bay=Companion module bay for the Tiberium harvester. Insert speed, productivity, efficiency, or quality modules. Press SHIFT+E while driving to open.
