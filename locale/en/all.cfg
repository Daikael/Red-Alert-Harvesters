[technology-description]
Old-World-Harvesting=Unlocks the Ore Truck and dump refinery. Requires solar energy (the truck recipe includes a solar panel).
Tiberium-Harvesting=Unlocks the Tiberium harvester. Requires electric engines.
[mod-setting-name]
Auto-cncharvester-testing=Automatic harvester testing
harvester-auto-by-default=Automatic harvesters start by default
[mod-setting-description]
Auto-cncharvester-testing=Enables the 2.2 slow chunk ore/Tiberium index (one generated chunk per tick). Startup setting; restart required. Does not run the old teleport auto-harvester. Default off.
harvester-auto-by-default=Reserved startup setting from 1.1. Automatic harvester testing now enables the chunk index only.