[item-description]
cncharvester=An old war truck used to gather resources. Craft cost includes a solar panel and battery that provide a slow built-in recharge (not installed as removable equipment). Install your own grid equipment; Hybrid converts stored electricity into the hybrid-charge reservoir. SHIFT+E opens the module bay.
cncharvester-type2=An updated harvester used to safely gather tiberium. Craft cost includes a solar panel and battery that provide a slow built-in recharge (not installed as removable equipment). Install your own grid equipment; Hybrid converts stored electricity into the hybrid-charge reservoir. SHIFT+E opens the module bay.
refinery=A storage facility to deposit ore from the harvester.
Hybrid-drive=Optional grid battery. Hybrid conversion uses any stored grid energy; this item is not required and is not given free on a new truck.
Hybrid-drive-battery=Optional extra grid storage. Not given free on a new truck.
cncharvester-hybrid-charge=Electrical energy stored in the harvester's hybrid reservoir. Charged from baked-in solar, player-installed grid equipment, or converted solid fuel. Fuel inserted in the tank charges this electrical capacity. Not a removable item.
[fuel-category-name]
cncharvester-hybrid=Hybrid charge
[fuel-category-description]
cncharvester-hybrid=Hybrid-charge reservoir. Burnable fuel and grid electricity charge this electrical capacity. Nuclear fuel is not accepted.
